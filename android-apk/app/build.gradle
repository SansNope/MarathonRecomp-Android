plugins {
    id 'com.android.application'
}

// libmain.so and the libadrenotools hook libraries are built by the project's own CMake
// pipeline (scripts/Configure-Android.ps1) and handed over with
// -PmarathonJniLibs=<dir containing arm64-v8a/*.so>.
def marathonJniLibs = project.findProperty('marathonJniLibs') ?: 'src/main/jniLibs'
// Optional extra assets, e.g. the bundled Turnip drivers (deps/turnip-drivers with a
// bundled_driver/ folder), passed with -PmarathonAssets=<dir>.
def marathonAssets = project.findProperty('marathonAssets')

android {
    namespace = "io.github.sansnope.marathonrecomp"
    compileSdkVersion 35
    ndkVersion = "29.0.14206865"
    defaultConfig {
        // Separate install identity: does not replace UnleashedRecomp-Android or other forks.
        applicationId "io.github.sansnope.marathonrecomp.android"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 3
        versionName "0.1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            versionNameSuffix "-dev"
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        // SDL3's Java glue is used unmodified from the pinned submodule, matching the native SDL3.
        java.srcDirs += '../../thirdparty/SDL/android-project/app/src/main/java'
        jniLibs.srcDirs = [marathonJniLibs]
        if (marathonAssets != null) {
            assets.srcDirs += [marathonAssets]
        }
    }
    // libadrenotools loads its hook libraries by path from ApplicationInfo.nativeLibraryDir,
    // which only holds real files when native libraries are extracted at install time.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        abortOnError = false
    }
}
