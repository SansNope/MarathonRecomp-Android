name: Bug Report (Android)
description: Report a problem with the Android port / Сообщить о проблеме Android-версии
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the **unofficial Android port** of MarathonRecomp. Please do not report Android problems to upstream MarathonRecomp.
        Это **неофициальный порт** MarathonRecomp на Android. Не отправляйте проблемы Android-версии в оригинальный MarathonRecomp.

        Before reporting, see [docs/android/STATUS.md](https://github.com/SansNope/MarathonRecomp-Android/blob/main/docs/android/STATUS.md) for tested devices and known issues.
        Перед отправкой посмотрите [docs/android/STATUS.ru.md](https://github.com/SansNope/MarathonRecomp-Android/blob/main/docs/android/STATUS.ru.md): проверенные устройства и известные проблемы.
  - type: checkboxes
    id: validation
    attributes:
      label: Validation / Проверка
      options:
        - label: I have checked the [Issues](https://github.com/SansNope/MarathonRecomp-Android/issues) page and the known issues list / Я проверил(а) Issues и список известных проблем
          required: true
        - label: I use game files dumped from my own copy of the Xbox 360 game / Я использую файлы игры с собственной копии для Xbox 360
          required: true
  - type: input
    id: device
    attributes:
      label: Phone / Телефон
      description: Model, SoC, GPU / Модель, процессор, GPU
      placeholder: "POCO F5, Snapdragon 7+ Gen 2, Adreno 725"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version / Версия Android
      placeholder: "Android 16, HyperOS 3"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or commit / Версия приложения или коммит
      description: Where you got the APK, or the commit you built from / Откуда APK или из какого коммита собран
      placeholder: "0.1.0-dev, built from b70d3a4"
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Vulkan driver (launcher) / Драйвер Vulkan (лаунчер)
      options:
        - Auto (recommended)
        - System
        - Bundled Turnip
        - Adreno 710 (Vauzi)
        - A725 Performance (experimental; sysmem+nobin)
        - Adreno 8xx (Snapdragon 8 Elite; sysmem+nobin)
        - Imported
    validations:
      required: true
  - type: dropdown
    id: render-mode
    attributes:
      label: Turnip render mode (launcher) / Режим рендера Turnip (лаунчер)
      options:
        - Auto (recommended)
        - GMEM
        - Sysmem
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: In-game graphics settings / Настройки графики в игре
      description: Resolution scale, frame rate, VSync, other changes / Масштаб разрешения, FPS, VSync, другие изменения
      placeholder: "Resolution scale 100%, 60 FPS, VSync on"
  - type: checkboxes
    id: dlc
    attributes:
      label: DLC
      description: If you have DLC installed, please specify which ones you have. / Отметьте установленные DLC.
      options:
        - label: Additional Episode "Sonic Boss Attack"
        - label: Additional Episode "Shadow Boss Attack"
        - label: Additional Episode "Silver Boss Attack"
        - label: Additional Episode "Team Attack Amigo"
        - label: Additional Mission Pack "Sonic/Very Hard"
        - label: Additional Mission Pack "Shadow/Very Hard"
        - label: Additional Mission Pack "Silver/Very Hard"
  - type: textarea
    id: description
    attributes:
      label: Describe the problem / Описание проблемы
      description: What happened? Crash, black screen, graphics glitch, low FPS, controls... / Что произошло? Вылет, чёрный экран, графика, низкий FPS, управление...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / Как повторить
      placeholder: |
        1. Launch the game / Запустить игру
        2. Go to '...' / Перейти в '...'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Как должно быть
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: log.txt
      description: |
        Required. Launcher → Advanced → Open logs, then drag `log.txt` here (and `log_prev.txt` if the game crashed and was started again).
        Обязательно. Лаунчер → «Дополнительно» → «Открыть логи», затем перетащите сюда `log.txt` (и `log_prev.txt`, если после вылета игра запускалась снова).
      placeholder: Drop the file here / Перетащите файл сюда
    validations:
      required: true
  - type: textarea
    id: footage
    attributes:
      label: Screenshots or video / Скриншоты или видео
  - type: textarea
    id: context
    attributes:
      label: Additional context / Дополнительно
      description: Mods, imported drivers, marker files (`thread_affinity.disabled`, `prerotation.disabled`...) / Моды, импортированные драйверы, файлы-переключатели
